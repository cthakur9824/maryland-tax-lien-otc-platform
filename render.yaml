services:
  - type: web
    name: maryland-tax-lien-otc-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python RealEstateResearch/app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENABLE_TELEGRAM_BOT
        value: "true"
      - key: OTC_AUTO_SYNC_SECONDS
        value: "43200"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

