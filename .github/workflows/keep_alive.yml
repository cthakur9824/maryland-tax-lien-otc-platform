name: Render 24-7 Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier spin-down after 15 minutes of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_EXTERNAL_URL || vars.RENDER_EXTERNAL_URL || 'https://maryland-tax-lien-otc-platform.onrender.com' }}
        run: |
          echo "Pinging ${RENDER_URL}/health ..."
          curl -fsSL --retry 3 --max-time 25 "${RENDER_URL}/health" || true

